<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accountability</title>
  <meta name="theme-color" content="#f6f5f2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234c5fd5'/><path d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 16.5l4.5 4.5L23 11.5"/></svg>
      </span>
      <span class="brand-name">Accountability</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Ansichten">
      <button data-view="today" class="tab"><span class="tab-ico">◉</span><span>Heute</span></button>
      <button data-view="cycle" class="tab"><span class="tab-ico">▦</span><span>Cycle</span></button>
      <button data-view="settings" class="tab"><span class="tab-ico">⚙</span><span>Einstellungen</span></button>
    </nav>
    <div class="topbar-right">
      <span class="save-state" id="saveState" aria-live="polite"></span>
      <button class="icon-btn" id="themeBtn" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">◐</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script src="seed-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
